<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Page not found — The Unstoppable Mind</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0a0a0a;--accent:#ff4d00;--line:#2a2a2a;--muted:#a6a6a6;
--display:"Helvetica Neue",Helvetica,Arial,system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:28px}
.box{max-width:560px}
.big{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.9;
font-size:clamp(72px,20vw,160px);margin:0;color:var(--accent)}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(22px,4vw,32px);margin:10px 0 12px}
p{color:var(--muted);font-size:16px;margin:0 0 28px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#0a0a0a;
font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px;padding:15px 26px;text-decoration:none;
clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cta:hover{background:#fff}
.back{display:block;margin-top:18px;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <p class="big">404</p>
  <h1>Lost the thread</h1>
  <p>That page isn't here. The momentum arrow points home.</p>
  <a class="cta" href="/unstoppable-mind-companion/">Back to home</a>
  <a class="back" href="/unstoppable-mind-companion/play/">Or open the companion app &rarr;</a>
</div>
</body>
</html>
